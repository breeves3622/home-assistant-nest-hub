# Home Assistant Core Configuration

default_config:

homeassistant:
  name: Home Assistant
  unit_system: us_customary
  time_zone: America/New_York
  external_url: "https://home.clanhanoi.net"

# Google Cast Integration for Google Nest Home Hub
cast:

# HTTP & Proxy settings for Reverse Proxy / Cloudflare Tunnel / Portainer
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.16.0.0/12    # Covers all Docker container subnets (172.16.0.0 - 172.31.255.255)
    - 192.168.0.0/16   # Covers local LAN subnets
    - 10.0.0.0/8       # Covers 10.x.x.x subnets
    - 127.0.0.1
    - ::1
  cors_allowed_origins:
    - "https://cast.home-assistant.io"
    - "https://home.clanhanoi.net"
    - "http://home.clanhanoi.net"

# Lovelace Dashboards Configuration
lovelace:
  mode: storage
  dashboards:
    nest-hub-dashboard:
      mode: yaml
      title: Nest Hub Dashboard
      icon: mdi:tablet-dashboard
      show_in_sidebar: true
      filename: dashboards/nest_hub_dashboard.yaml

# File Includes
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
