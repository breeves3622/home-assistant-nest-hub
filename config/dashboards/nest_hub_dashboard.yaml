title: Work Time Clock
views:
  - title: Main
    path: main
    type: panel
    cards:
      - type: grid
        columns: 2
        square: false
        cards:
          # Left Column: Live Status, Time & Hours Summary
          - type: vertical-stack
            cards:
              - type: markdown
                content: >
                  # 💼 {{ states('input_select.work_shift_status') | upper }}
                  ### {{ now().strftime('%I:%M %p — %A, %b %d') }}

              - type: tile
                entity: timer.work_break_timer
                name: "Break Countdown"
                icon: mdi:timer-sand-full

              - type: grid
                columns: 2
                square: false
                cards:
                  - type: tile
                    entity: input_number.today_worked_hours
                    name: "Today Worked"
                    icon: mdi:clock-check-outline

                  - type: tile
                    entity: input_number.weekly_worked_hours
                    name: "Weekly Total"
                    icon: mdi:calendar-week

          # Right Column: Big 1-Touch Action Buttons
          - type: vertical-stack
            cards:
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: button
                    name: Clock In
                    icon: mdi:briefcase-clock
                    tap_action:
                      action: call-service
                      service: script.clock_in

                  - type: button
                    name: 15-Min Break
                    icon: mdi:coffee
                    tap_action:
                      action: call-service
                      service: script.start_15min_paid_break

                  - type: button
                    name: 30-Min Lunch
                    icon: mdi:food-fork-drink
                    tap_action:
                      action: call-service
                      service: script.start_lunch_break

                  - type: button
                    name: Clock Out
                    icon: mdi:briefcase-off
                    tap_action:
                      action: call-service
                      service: script.clock_out

              - type: grid
                columns: 2
                square: false
                cards:
                  - type: button
                    name: Reset Week
                    icon: mdi:refresh
                    tap_action:
                      action: call-service
                      service: script.reset_weekly_hours

                  - type: button
                    name: Recast Screen
                    icon: mdi:cast
                    tap_action:
                      action: call-service
                      service: cast.show_lovelace_view
                      data:
                        entity_id: media_player.google_nest_hub
                        dashboard_path: nest-hub-dashboard
                        view_path: main
