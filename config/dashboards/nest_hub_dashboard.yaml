title: Work & Home Dashboard
views:
  - title: Home
    path: main
    icon: mdi:briefcase-clock
    type: grid
    square: false
    columns: 3
    cards:
      # Header Card: Time, Date & Status
      - type: markdown
        content: >
          # ☕ Work & Break Tracker
          **Current Status:** {{ states('input_select.work_status') }}

      # Active Timer Card
      - type: timer
        entity: timer.work_break_timer
        name: "Break Countdown"

      # Clock & Date Card
      - type: markdown
        content: >
          ## {{ now().strftime('%I:%M %p') }}
          **{{ now().strftime('%A, %B %d') }}**

      # Work Break Quick Controls
      - type: grid
        title: Break Controls
        columns: 3
        square: false
        cards:
          - type: button
            name: 15-Min Break
            icon: mdi:coffee
            tap_action:
              action: call-service
              service: script.start_15min_break

          - type: button
            name: 30-Min Lunch
            icon: mdi:food-fork-drink
            tap_action:
              action: call-service
              service: script.start_30min_lunch

          - type: button
            name: Back to Work
            icon: mdi:briefcase-check
            tap_action:
              action: call-service
              service: script.cancel_break

      # Status Select & Controls
      - type: entities
        title: Status Selector
        entities:
          - entity: input_select.work_status
            name: "Work Status"
          - entity: timer.work_break_timer
            name: "Timer State"

      # Recast Button & Quick Tools
      - type: grid
        title: Display Controls
        columns: 2
        square: false
        cards:
          - type: button
            name: Recast Dashboard
            icon: mdi:cast
            tap_action:
              action: call-service
              service: cast.show_lovelace_view
              data:
                entity_id: media_player.google_nest_hub
                dashboard_path: nest-hub-dashboard
                view_path: main

          - type: button
            name: Refresh View
            icon: mdi:refresh
            tap_action:
              action: call-service
              service: homeassistant.update_entity
              target:
                entity_id: timer.work_break_timer
