# Time Clock & Break Management Scripts

clock_in:
  alias: "Clock In"
  icon: mdi:briefcase-clock
  sequence:
    - service: input_select.select_option
      target:
        entity_id: input_select.work_shift_status
      data:
        option: "Working"
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.shift_start_time
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
    - service: input_number.set_value
      target:
        entity_id: input_number.today_worked_hours
      data:
        value: 0
    - service: input_number.set_value
      target:
        entity_id: input_number.total_lunch_minutes_today
      data:
        value: 0
    - service: tts.speak
      target:
        entity_id: tts.google_en_com
      data:
        media_player_entity_id: media_player.google_nest_hub
        message: "Clocked in. Have a productive shift!"

start_15min_paid_break:
  alias: "Start 15-Min Paid Break"
  icon: mdi:coffee
  sequence:
    - service: input_select.select_option
      target:
        entity_id: input_select.work_shift_status
      data:
        option: "On Paid Break"
    - service: timer.start
      target:
        entity_id: timer.work_break_timer
      data:
        duration: "00:15:00"
    - service: tts.speak
      target:
        entity_id: tts.google_en_com
      data:
        media_player_entity_id: media_player.google_nest_hub
        message: "15 minute paid break started. Paid breaks do not deduct from work hours."
    - delay: "00:13:00"
    - service: tts.speak
      target:
        entity_id: tts.google_en_com
      data:
        media_player_entity_id: media_player.google_nest_hub
        message: "Warning! Your 15 minute break is almost over. 2 minutes remaining!"
    - delay: "00:02:00"
    - service: tts.speak
      target:
        entity_id: tts.google_en_com
      data:
        media_player_entity_id: media_player.google_nest_hub
        message: "Break time is over! Time to get back to work."
    - service: input_select.select_option
      target:
        entity_id: input_select.work_shift_status
      data:
        option: "Working"

start_lunch_break:
  alias: "Start Unpaid Lunch Break"
  icon: mdi:food-fork-drink
  sequence:
    - service: input_select.select_option
      target:
        entity_id: input_select.work_shift_status
      data:
        option: "On Lunch"
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.lunch_start_time
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
    - service: timer.start
      target:
        entity_id: timer.work_break_timer
      data:
        duration: "00:30:00"
    - service: tts.speak
      target:
        entity_id: tts.google_en_com
      data:
        media_player_entity_id: media_player.google_nest_hub
        message: "30 minute lunch break started. Enjoy your lunch!"
    - delay: "00:28:00"
    - service: tts.speak
      target:
        entity_id: tts.google_en_com
      data:
        media_player_entity_id: media_player.google_nest_hub
        message: "Warning! Your lunch break is almost over. 2 minutes remaining!"
    - delay: "00:02:00"
    - service: input_number.set_value
      target:
        entity_id: input_number.total_lunch_minutes_today
      data:
        value: "{{ states('input_number.total_lunch_minutes_today') | float(0) + 30 }}"
    - service: tts.speak
      target:
        entity_id: tts.google_en_com
      data:
        media_player_entity_id: media_player.google_nest_hub
        message: "Lunch break is over! Time to get back to work."
    - service: input_select.select_option
      target:
        entity_id: input_select.work_shift_status
      data:
        option: "Working"

clock_out:
  alias: "Clock Out"
  icon: mdi:briefcase-off
  sequence:
    - service: script.turn_off
      target:
        entity_id:
          - script.start_15min_paid_break
          - script.start_lunch_break
    - service: timer.cancel
      target:
        entity_id: timer.work_break_timer
    - service: input_select.select_option
      target:
        entity_id: input_select.work_shift_status
      data:
        option: "Clocked Out"
    - service: input_number.set_value
      target:
        entity_id: input_number.today_worked_hours
      data:
        value: >
          {% set start = as_timestamp(states('input_datetime.shift_start_time')) | float(now().timestamp()) %}
          {% set total_seconds = now().timestamp() - start %}
          {% set lunch_seconds = (states('input_number.total_lunch_minutes_today') | float(0)) * 60 %}
          {% set net_hours = (total_seconds - lunch_seconds) / 3600 %}
          {{ [net_hours | round(2), 0] | max }}
    - service: input_number.set_value
      target:
        entity_id: input_number.weekly_worked_hours
      data:
        value: >
          {% set prev_weekly = states('input_number.weekly_worked_hours') | float(0) %}
          {% set today_hrs = states('input_number.today_worked_hours') | float(0) %}
          {{ (prev_weekly + today_hrs) | round(2) }}
    - service: tts.speak
      target:
        entity_id: tts.google_en_com
      data:
        media_player_entity_id: media_player.google_nest_hub
        message: "Clocked out. Great job today! You worked {{ states('input_number.today_worked_hours') }} hours today."

reset_weekly_hours:
  alias: "Reset Weekly Work Hours"
  icon: mdi:refresh
  sequence:
    - service: input_number.set_value
      target:
        entity_id: input_number.weekly_worked_hours
      data:
        value: 0
    - service: input_number.set_value
      target:
        entity_id: input_number.today_worked_hours
      data:
        value: 0
