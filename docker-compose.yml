version: '3.8'

services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ:-America/New_York}
    ports:
      - "8123:8123"
    restart: unless-stopped
    # If running on native Linux Docker directly (outside Windows/macOS VM), 
    # network_mode: host is recommended for mDNS discovery of Google Cast / Nest Hub devices:
    # network_mode: host

  # Optional: Cloudflare Tunnel for secure HTTPS external URL (Required for Google Cast)
  # To use: Set CLOUDFLARE_TUNNEL_TOKEN in Portainer Stack Environment Variables
  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    profiles:
      - tunnel
