version: '3.8'

services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ha_storage:/config
      - ./config/configuration.yaml:/config/configuration.yaml
      - ./config/automations.yaml:/config/automations.yaml
      - ./config/scripts.yaml:/config/scripts.yaml
      - ./config/scenes.yaml:/config/scenes.yaml
      - ./config/dashboards:/config/dashboards
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ:-America/New_York}
    ports:
      - "8123:8123"
    restart: unless-stopped

  # Kimai Open-Source Time Tracking Database
  kimai-db:
    container_name: kimai-db
    image: mariadb:10.11
    environment:
      - MYSQL_DATABASE=kimai
      - MYSQL_USER=kimai
      - MYSQL_PASSWORD=${KIMAI_DB_PASSWORD:-kimai_secret_pass}
      - MYSQL_ROOT_PASSWORD=${KIMAI_DB_ROOT_PASSWORD:-kimai_root_pass}
    volumes:
      - kimai_db_data:/var/lib/mysql
    restart: unless-stopped

  # Kimai Open-Source Time Tracker Application
  kimai:
    container_name: kimai
    image: kimai/kimai2:apache
    environment:
      - APP_ENV=prod
      - TRUSTED_HOSTS=localhost,127.0.0.1,kimai,home.clanhanoi.net
      - DATABASE_URL=mysql://kimai:${KIMAI_DB_PASSWORD:-kimai_secret_pass}@kimai-db:3306/kimai?charset=utf8mb4&serverVersion=10.11.0-MariaDB
      - TZ=${TZ:-America/New_York}
      - ADMINMAIL=admin@clanhanoi.net
      - ADMINPASS=${KIMAI_ADMIN_PASSWORD:-changeme123}
    volumes:
      - kimai_data:/opt/kimai/var
    ports:
      - "8001:8001"
    restart: unless-stopped
    depends_on:
      - kimai-db

volumes:
  ha_storage:
  kimai_db_data:
  kimai_data:
